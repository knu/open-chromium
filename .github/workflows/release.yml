name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check release asset
        run: |
          test -x bin/open-chromium
          test -x bin/open-browser
          test -x bin/chromium-profile
          sh -n bin/open-browser
          /usr/bin/ruby -c bin/chromium-profile
          osacompile -l JavaScript -o "$RUNNER_TEMP/open-chromium.scpt" bin/open-chromium

      - name: Package release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          package_dir=$(mktemp -d "$RUNNER_TEMP/package.XXXXXX")
          mkdir -p "$package_dir/bin"
          install -m 755 bin/open-chromium "$package_dir/bin/open-chromium"
          install -m 755 bin/open-browser "$package_dir/bin/open-browser"
          install -m 755 bin/chromium-profile "$package_dir/bin/chromium-profile"
          cp LICENSE "$package_dir/LICENSE"
          tar -czf "$RUNNER_TEMP/open-chromium-${TAG#v}.tar.gz" -C "$package_dir" bin LICENSE

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "$RUNNER_TEMP/open-chromium-${TAG#v}.tar.gz" --verify-tag --generate-notes
